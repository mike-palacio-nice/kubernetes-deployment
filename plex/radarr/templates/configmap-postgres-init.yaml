{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "radarr.fullname" . }}-postgres-init
  labels:
    app: {{ include "radarr.name" . }}
    chart: {{ include "radarr.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
data:
  init-databases.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        CREATE DATABASE "{{ .Values.postgres.databases.main }}";
        CREATE DATABASE "{{ .Values.postgres.databases.log }}";
    EOSQL
{{- end }}
