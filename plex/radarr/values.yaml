## media.radarr.values.yml
replicaCount: 1

image:
  repository: "linuxserver/radarr"
  tag: 6.0.4
  pullPolicy: IfNotPresent

env:
  - name: PUID
    value: "65534"
  - name: PGID
    value: "65534"

service:
  type: NodePort
  port: 80

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    external-dns.alpha.kubernetes.io/hostname: radarr.palacpl.us
    external-dns.alpha.kubernetes.io/ttl: "120" #optional
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
  pathType: Prefix
  hosts:
    - host: radarr.palacpl.us
      path: "/"
  tls:
    enabled: true
    secretName: secure-tls

volumes:
  - name: plex-pvc
    persistentVolumeClaim:
      claimName: plex-pvc # PersistentVolumeClaim created earlier

volumeMounts:
  - name: plex-pvc
    mountPath: "/config"
    subPath: Radarr
  - name: plex-pvc
    mountPath: "/downloads"
    subPath: media # Path /mnt/ssd/media/downloads/transmission where radarr picks up downloaded movies
  - name: plex-pvc
    mountPath: "/movies"
    subPath: "library/movies" # Path /mnt/ssd/media/library/movies where radarr moves and renames the movies

resources:
  requests:
    memory: 150Mi
    cpu: 0.1
  limits:
    memory: 1Gi
    cpu: 0.5

postgres:
  enabled: true
  puid: 65534
  pgid: 65534
  image:
    repository: postgres
    tag: "17"
    pullPolicy: IfNotPresent
  auth:
    username: radarr
    password: radarr
    database: postgres
  databases:
    main: radarr-main
    log: radarr-log
  dataDir: /var/lib/postgresql/data/pgdata
  persistence:
    claimName: plex-pvc
    subPath: Radarr/postgres
    mountPath: /var/lib/postgresql/data
  resources:
    requests:
      memory: 128Mi
      cpu: 0.1
    limits:
      memory: 512Mi
      cpu: 0.5

migration:
  enabled: false
  ## Scale the Radarr deployment to 0 before enabling to avoid plex-pvc conflicts.
  ## 1. Deploy with postgres enabled and let Radarr start once (creates PG schema)
  ## 2. Scale deployment to 0 replicas
  ## 3. Set migration.enabled: true and helm upgrade
  ## 4. Set migration.enabled: false and scale deployment back to 1
  configSubPath: Radarr
  sqliteDbPath: /config/radarr.db
  markerFilePath: /config/.postgres-migrated
  backupSqlite: true
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  pgloader:
    image:
      repository: ghcr.io/roxedus/pgloader
      tag: latest
      pullPolicy: IfNotPresent
    extraArgs: []
    ## For large databases, uncomment:
    # extraArgs:
    #   - '--with "prefetch rows = 100"'
    #   - '--with "batch size = 1MB"'
  resources:
    requests:
      memory: 256Mi
      cpu: 0.2
    limits:
      memory: 1Gi
      cpu: 1.0
